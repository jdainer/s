<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Madeleidy</title>
    
    <!-- Soporte Móvil & PWA -->
    <meta name="theme-color" content="#1a0b16">
    <link rel="apple-touch-icon" href="1/1.png">

    <!-- Librerías React y Babel desde CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #2d122d 0%, #0f0511 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
        }

        #root {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Encabezado Femenino Estilo Glassmorphism */
        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 20px;
            background: rgba(45, 18, 45, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(244, 114, 182, 0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #fce7f3 0%, #f472b6 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 0.72rem;
            color: #fbcfe8;
            opacity: 0.8;
            margin-top: 1px;
        }

        /* Botón estilo Jhon con degrado rosado/magenta */
        .btn-jhon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-jhon:active {
            transform: scale(0.95);
        }

        /* Botón Flotante de Audio con tono fucsia y efecto pulso */
        .audio-control-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(80, 20, 60, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(244, 114, 182, 0.3);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            outline: none;
        }

        .audio-pulse {
            animation: pulse-ring-pink 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring-pink {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6); }
            50% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body>

    <!-- Encabezado Móvil -->
    <header class="mobile-header">
        <div class="header-title">
            <h1>Madeleidy ✨</h1>
            <p>Un espacio especial para ti</p>
        </div>
        <a href="index.html" class="btn-jhon">Jhon</a>
    </header>

    <!-- Reproductor de Audio -->
    <audio id="miAudio" loop preload="auto">
        <source src="1/creo.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón Flotante para controlar Audio -->
    <button id="btnAudio" class="audio-control-btn audio-pulse" aria-label="Audio">
        <span id="audioIcon">💖</span>
    </button>

    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const DEFAULT_IMAGES = [
            { src: "1/1.png" },
            { src: "1/2.png" },
            { src: "1/3.png" },
            { src: "1/4.png" },
            { src: "1/5.png" },
            { src: "1/6.png" },
            { src: "1/7.png" },
            { src: "1/8.png" },
            { src: "1/9.png" },
        ];

        function RoundCarousel({
            images = DEFAULT_IMAGES,
            spacing = 3,
            speed = 1,
            direction = "right",
            drag = true,
            sensitivity = 5,
            tilt = -7,
            perspective = 3000,
            cornerRadius = 22,
            innerDim = 3.5,
            background = "transparent",
            style = {},
        }) {
            const items = images.length > 0 ? images : DEFAULT_IMAGES;
            const count = items.length;

            // Ajuste responsivo para celulares
            const [dimensions, setDimensions] = useState(() => {
                const w = window.innerWidth;
                if (w < 480) return { width: 210, height: 270 };
                if (w < 768) return { width: 250, height: 310 };
                return { width: 300, height: 360 };
            });

            useEffect(() => {
                const handleResize = () => {
                    const w = window.innerWidth;
                    if (w < 480) setDimensions({ width: 210, height: 270 });
                    else if (w < 768) setDimensions({ width: 250, height: 310 });
                    else setDimensions({ width: 300, height: 360 });
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const { width: imageWidth, height: imageHeight } = dimensions;

            const ringRef = useRef(null);
            const rafRef = useRef(0);
            const rotYRef = useRef(0);
            const velRef = useRef(0);
            const lastRef = useRef(0);
            const dragRef = useRef({ active: false, x: 0 });

            const angle = 360 / count;
            const factor = 1 + spacing * 0.15;
            const radius = (imageWidth * factor) / (2 * Math.tan(Math.PI / count));
            const degPerSec = speed * 6 * (direction === "left" ? -1 : 1);

            useEffect(() => {
                const ring = ringRef.current;
                if (!ring) return;
                const apply = () =>
                    (ring.style.transform = `translateZ(${-radius}px) rotateY(${rotYRef.current}deg)`);
                apply();

                const draw = (now) => {
                    const dt = lastRef.current ? (now - lastRef.current) / 1000 : 0;
                    lastRef.current = now;
                    const f = Math.min(dt, 0.1);
                    const d = dragRef.current;
                    if (!d.active) {
                        if (Math.abs(velRef.current) > 0.01) {
                            rotYRef.current += velRef.current * f;
                            velRef.current *= 0.94;
                        } else {
                            rotYRef.current += degPerSec * f;
                        }
                    }
                    apply();
                    rafRef.current = requestAnimationFrame(draw);
                };
                rafRef.current = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(rafRef.current);
            }, [radius, degPerSec, count]);

            const onPointerDown = (e) => {
                if (!drag) return;
                e.currentTarget.setPointerCapture?.(e.pointerId);
                dragRef.current = { active: true, x: e.clientX };
                velRef.current = 0;
            };

            const onPointerMove = (e) => {
                const d = dragRef.current;
                if (!d.active) return;
                const dx = e.clientX - d.x;
                d.x = e.clientX;
                const k = 0.3 * sensitivity;
                rotYRef.current += dx * k;
                velRef.current = dx * k * 60;
            };

            const onPointerUp = (e) => {
                e.currentTarget.releasePointerCapture?.(e.pointerId);
                dragRef.current.active = false;
            };

            const faceBase = {
                position: "absolute",
                inset: 0,
                borderRadius: cornerRadius,
                overflow: "hidden",
                backfaceVisibility: "hidden",
                backgroundSize: "cover",
                backgroundPosition: "center",
            };

            return (
                <div
                    style={{
                        ...style,
                        width: "100%",
                        height: "100%",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        overflow: "hidden",
                        background,
                        perspective: `${perspective}px`,
                        cursor: drag ? "grab" : "default",
                        touchAction: "none",
                        paddingTop: "40px"
                    }}
                    onPointerDown={onPointerDown}
                    onPointerMove={onPointerMove}
                    onPointerUp={onPointerUp}
                    onPointerCancel={onPointerUp}
                >
                    <div
                        style={{
                            transformStyle: "preserve-3d",
                            transform: `rotateX(${tilt}deg)`,
                        }}
                    >
                        <div
                            ref={ringRef}
                            style={{
                                position: "relative",
                                width: imageWidth,
                                height: imageHeight,
                                transformStyle: "preserve-3d",
                            }}
                        >
                            {items.map((img, i) => {
                                const src = img?.src;
                                return (
                                    <div
                                        key={i}
                                        style={{
                                            position: "absolute",
                                            inset: 0,
                                            transform: `rotateY(${i * angle}deg) translateZ(${radius}px)`,
                                            transformStyle: "preserve-3d",
                                        }}
                                    >
                                        <div
                                            style={{
                                                ...faceBase,
                                                backgroundColor: src ? "transparent" : "#2d122d",
                                                backgroundImage: src ? `url(${src})` : undefined,
                                                boxShadow: "0 12px 35px rgba(236, 72, 153, 0.25), 0 6px 20px rgba(0,0,0,0.5)",
                                                border: "1.5px solid rgba(244, 114, 182, 0.3)"
                                            }}
                                        />
                                        <div
                                            style={{
                                                ...faceBase,
                                                transform: "rotateY(180deg)",
                                                backgroundColor: src ? "transparent" : "#1a0b16",
                                                backgroundImage: src ? `url(${src})` : undefined,
                                                filter: `brightness(${innerDim / 10})`,
                                            }}
                                        />
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<RoundCarousel />);

        // Lógica de Audio
        const audio = document.getElementById('miAudio');
        const btnAudio = document.getElementById('btnAudio');
        const audioIcon = document.getElementById('audioIcon');

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    audioIcon.textContent = '💖';
                    btnAudio.classList.remove('audio-pulse');
                }).catch(err => console.log("Error al reproducir audio:", err));
            } else {
                audio.pause();
                audioIcon.textContent = '🤍';
            }
        }

        btnAudio.addEventListener('click', toggleAudio);

        window.addEventListener('click', function() {
            if (audio.paused) {
                audio.play().then(() => {
                    audioIcon.textContent = '💖';
                    btnAudio.classList.remove('audio-pulse');
                }).catch(() => {});
            }
        }, { once: true });

    </script>
</body>
</html>
